<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dongxiong Liu · Academic Portfolio</title>
<meta name="description" content="Dongxiong Liu (DX3906) — computational materials researcher. Research notes, essays, and learning journal.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%91%8B%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
@import url('https://miaoda.feishu.cn/fonts/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{
  --serif:"Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","Microsoft YaHei","PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
}
html[data-theme="light"]{
  --bg:#fdfdfc;--bg-soft:#f4f6f9;--bg-code:#f3f5f8;--bg-quote:#f4f6f9;
  --text:#1f2328;--text-soft:#525960;--muted:#8b949e;
  --line:#d1d9e0;--line-soft:#e6ebf0;
  --link:#0969da;--link-hover:#0550ae;
  --accent:#165DFF;--gold:#9a6700;
  --shadow:0 1px 3px rgba(27,31,36,.05),0 1px 2px rgba(27,31,36,.03);
  --glow:radial-gradient(1200px 500px at 70% -10%,rgba(9,105,218,.06),transparent 60%);
}
html[data-theme="dark"]{
  --bg:#0d1117;--bg-soft:#161b22;--bg-code:#161b22;--bg-quote:#131820;
  --text:#e6edf3;--text-soft:#9da7b3;--muted:#768390;
  --line:#30363d;--line-soft:#21262d;
  --link:#4493f8;--link-hover:#79b8ff;
  --accent:#4d7cff;--gold:#d4a72c;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --glow:radial-gradient(1200px 500px at 70% -10%,rgba(68,147,248,.08),transparent 60%);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.85;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .3s,color .3s;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;background:var(--glow);pointer-events:none;
}
::selection{background:rgba(9,105,218,.18)}
a{color:var(--link);text-decoration:none;transition:color .15s}
a:hover{color:var(--link-hover);text-decoration:none}
img{max-width:100%;height:auto}
hr{border:none;border-top:1px solid var(--line-soft);margin:32px 0}

/* 精致滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* ===== Nav ===== */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--line-soft);
}
.nav-inner{
  max-width:760px;margin:0 auto;padding:0 24px;
  height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{
  font-family:var(--serif);font-weight:700;font-size:17px;color:var(--text);
  display:flex;align-items:center;gap:7px;
  padding:6px 8px;margin:-6px -8px;border-radius:8px;
  transition:background .15s;
}
.brand:hover{text-decoration:none;color:var(--text);background:var(--bg-soft)}
.brand .wave{font-size:16px}
.nav-links{display:flex;align-items:center;gap:2px;flex:1;justify-content:center}
.nav-links a{
  font-size:14px;color:var(--text-soft);padding:6px 12px;border-radius:7px;
  transition:color .15s,background .15s;font-weight:400;position:relative;
}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--bg-soft)}
.nav-links a.active::after{
  content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;
  background:var(--link);border-radius:2px;
}
.nav-actions{display:flex;align-items:center;gap:4px}
.icon-btn{
  width:34px;height:34px;border-radius:8px;border:1px solid transparent;
  background:transparent;color:var(--text-soft);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-family:var(--mono);font-weight:500;transition:all .15s;
}
.icon-btn:hover{color:var(--text);border-color:var(--line);background:var(--bg-soft)}
.icon-btn svg{width:16px;height:16px}

/* ===== Layout ===== */
.container{max-width:720px;margin:0 auto;padding:76px 24px 48px}
.page{display:none;animation:fadeIn .45s cubic-bezier(.22,.61,.36,1)}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Home / Welcome ===== */
.welcome{padding:64px 24px 44px;position:relative}
.welcome h1{
  font-family:var(--serif);font-weight:700;font-size:clamp(28px,4.2vw,36px);
  line-height:1.3;margin-bottom:18px;letter-spacing:-.01em;
}
.welcome .intro{
  font-size:16px;line-height:1.9;color:var(--text-soft);margin-bottom:14px;
}
.welcome .intro b{color:var(--text);font-weight:600}
.welcome .meta-line{
  font-family:var(--mono);font-size:12px;color:var(--muted);
  margin-top:22px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;
  padding-top:20px;border-top:1px solid var(--line-soft);
}
.welcome .meta-line a{color:var(--muted)}
.welcome .meta-line a:hover{color:var(--link)}

/* ===== Post List ===== */
.post-list-section{padding:16px 24px 48px}
.post-list-section .section-label{
  font-family:var(--mono);font-size:11.5px;color:var(--muted);
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;
  display:flex;align-items:center;gap:12px;
}
.post-list-section .section-label::after{
  content:"";flex:1;height:1px;background:var(--line-soft);
}
.post-item{
  padding:30px 0;border-bottom:1px solid var(--line-soft);
  transition:transform .25s ease;position:relative;
}
.post-item:last-child{border-bottom:none}
.post-item:hover{transform:translateX(4px)}
.post-item h2{
  font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.45;
  margin-bottom:10px;letter-spacing:-.005em;
}
.page-section .story-item h2{font-size:26px;line-height:1.4;margin-bottom:8px;color:var(--text)}
.page-section .story-item .post-meta{margin-bottom:4px}
.post-item h2 a{color:var(--text);
  background-image:linear-gradient(var(--link),var(--link));
  background-size:0% 1.5px;background-repeat:no-repeat;background-position:0 100%;
  transition:background-size .3s ease,color .2s;
}
.post-item h2 a:hover{color:var(--link);background-size:100% 1.5px;text-decoration:none}
.post-item .post-meta{
  font-family:var(--mono);font-size:12px;color:var(--muted);
  margin-bottom:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
}
.post-item .post-meta .tag{
  color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 28%,transparent);
  background:color-mix(in srgb,var(--gold) 7%,transparent);
  padding:1px 9px;border-radius:999px;font-size:11px;
}
.post-item .post-excerpt{
  font-size:15.5px;line-height:1.85;color:var(--text-soft);
}
.post-item .post-excerpt p{margin-bottom:12px}
.post-item .post-excerpt p:last-child{margin-bottom:0}
.read-more{
  font-family:var(--mono);font-size:12.5px;color:var(--link);
  display:inline-block;margin-top:12px;
}
	.read-more:hover{color:var(--link-hover);letter-spacing:.02em}
.post-list-section .post-item{display:flex;flex-direction:column;gap:8px;padding:18px 0}
.post-list-section .post-item.home-latest{flex-direction:row;gap:20px;align-items:flex-start}
.home-latest .home-thumb{flex:none;width:180px;height:118px;border-radius:10px;overflow:hidden;border:1px solid #e5e7eb;transition:transform .2s,box-shadow .2s;display:block}
.home-latest .home-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.home-latest .home-thumb:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.1)}
.home-latest .home-latest-body{flex:1;min-width:0}
.post-list-section .post-item h2{font-size:18.5px;margin-bottom:0}
.post-list-section .post-item .post-meta{margin-bottom:2px}
.post-list-section .post-item .post-excerpt{font-size:14px;line-height:1.75;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.post-list-section .post-item .read-more{margin-top:2px}
.notes-compact .post-item .post-excerpt{-webkit-line-clamp:3;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}

/* ===== Post Detail ===== */
.post-detail{padding:52px 24px 80px}
.post-detail .back-link{
  font-family:var(--mono);font-size:12.5px;color:var(--muted);
  display:inline-flex;align-items:center;gap:5px;margin-bottom:28px;cursor:pointer;
  transition:color .15s,gap .15s;
}
.post-detail .back-link:hover{color:var(--link);text-decoration:none;gap:9px}
.post-detail h1{
  font-family:var(--serif);font-weight:700;font-size:clamp(26px,4.5vw,34px);
  line-height:1.35;margin-bottom:14px;letter-spacing:-.01em;
}
.post-detail .post-meta{
  font-family:var(--mono);font-size:12px;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:14px;margin-bottom:28px;
  padding-bottom:20px;border-bottom:1px solid var(--line-soft);
}
.post-detail .post-meta .tag{color:var(--gold)}

/* TOC */
.toc{
  background:var(--bg-soft);border:1px solid var(--line-soft);border-radius:10px;
  padding:18px 22px;margin-bottom:36px;
}
.toc-title{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;
}
.toc ul{list-style:none}
.toc li{padding:2px 0}
.toc li a{font-size:13.5px;color:var(--text-soft);transition:color .15s}
.toc li a:hover{color:var(--link)}
.toc li.level-3{padding-left:18px}

/* Article Body */
.post-body{font-size:16px;line-height:1.9;color:var(--text)}
.post-body h2{
  font-family:var(--serif);font-weight:700;font-size:23px;
  margin:40px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--line-soft);
  letter-spacing:-.005em;
}
.post-body h3{
  font-family:var(--serif);font-weight:600;font-size:18.5px;
  margin:28px 0 12px;
}
.post-body p{margin-bottom:16px}
.post-body ul,.post-body ol{margin:0 0 16px 24px}
.post-body li{margin-bottom:6px;font-size:15.5px;line-height:1.8}
.post-body strong{font-weight:600}
.post-body em{font-style:italic}
.post-body blockquote{
  border-left:3px solid var(--gold);background:var(--bg-quote);
  padding:14px 22px;margin:22px 0;border-radius:0 8px 8px 0;
  color:var(--text-soft);font-size:15px;
}
.post-body blockquote p{margin-bottom:8px}
.post-body blockquote p:last-child{margin-bottom:0}
.post-body code{
  font-family:var(--mono);font-size:13.5px;background:var(--bg-code);
  padding:2px 6px;border-radius:5px;color:var(--text);
}
.post-body pre{
  background:var(--bg-code);border:1px solid var(--line-soft);border-radius:10px;
  padding:18px 20px;margin:22px 0;overflow-x:auto;box-shadow:var(--shadow);
}
.post-body pre code{
  background:none;padding:0;font-size:13px;line-height:1.7;color:var(--text);
}
.post-body .spicy-take{
  display:inline-block;font-family:var(--mono);font-size:10.5px;
  color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);
  background:color-mix(in srgb,var(--gold) 9%,transparent);
  padding:2px 9px;border-radius:999px;margin-right:8px;vertical-align:middle;
}
.post-body .ref{
  font-size:13px;color:var(--muted);font-family:var(--mono);
}
.post-body .ref a{color:var(--muted)}

/* References */
.references{
  margin-top:48px;padding-top:24px;border-top:1px solid var(--line-soft);
}
.references h3{
  font-family:var(--mono);font-size:12.5px;color:var(--muted);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px;
}
.references ol{margin-left:20px}
.references li{
  font-size:13px;color:var(--text-soft);line-height:1.7;margin-bottom:6px;
}

/* ===== CV / Research ===== */
.page-section{padding:52px 24px 64px}
.page-section h1{
  font-family:var(--serif);font-weight:700;font-size:clamp(24px,4vw,30px);
  margin-bottom:8px;letter-spacing:-.01em;
}
.page-section .page-desc{font-size:15px;color:var(--muted);margin-bottom:32px}
.page-section h2{
  font-family:var(--mono);font-size:12px;color:var(--muted);
  letter-spacing:.14em;text-transform:uppercase;margin:38px 0 18px;
  padding-bottom:8px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:10px;
}
.page-section h2::before{content:"";width:6px;height:6px;background:var(--gold);border-radius:50%}
.cv-item{margin-bottom:26px;padding-left:4px}
.cv-item .cv-date{
  font-family:var(--mono);font-size:12px;color:var(--gold);margin-bottom:4px;letter-spacing:.02em;
}
.cv-item h3{font-family:var(--serif);font-weight:600;font-size:16.5px;margin-bottom:4px}
.cv-item .cv-sub{font-size:14px;color:var(--text-soft);margin-bottom:6px}
.cv-item p{font-size:14.5px;color:var(--text-soft);line-height:1.8}
.cv-item ul{margin:6px 0 0 20px}
.cv-item li{font-size:14px;color:var(--text-soft);margin-bottom:4px}

.award-row{
  display:grid;grid-template-columns:90px 1fr auto;gap:14px;
  padding:11px 10px;border-bottom:1px solid var(--line-soft);align-items:baseline;
  border-radius:6px;transition:background .15s;
}
.award-row:hover{background:var(--bg-soft)}
.award-row:last-child{border-bottom:none}
.award-year{font-family:var(--mono);font-size:12px;color:var(--gold)}
.award-name{font-size:14.5px}
.award-level{
  font-family:var(--mono);font-size:10.5px;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;
}

/* ===== FAQ ===== */
.faq-item{margin-bottom:28px;padding:18px 20px;background:var(--bg-soft);
  border:1px solid var(--line-soft);border-radius:10px;transition:border-color .2s}
.faq-item:hover{border-color:var(--line)}
.faq-item .q{
  font-family:var(--serif);font-weight:600;font-size:17px;margin-bottom:8px;
  color:var(--text);
}
.faq-item .a{font-size:15px;line-height:1.85;color:var(--text-soft)}
.faq-item .a p{margin-bottom:10px}
.faq-item .a p:last-child{margin-bottom:0}

/* ===== Footer ===== */
footer{
  border-top:1px solid var(--line-soft);margin-top:48px;padding:32px 0 48px;
}
.footer-inner{
  max-width:720px;margin:0 auto;padding:0 24px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
}
.footer-inner .copy{font-family:var(--mono);font-size:12px;color:var(--muted)}
.footer-inner .links{display:flex;gap:16px;font-family:var(--mono);font-size:12px}
.footer-inner .links a{color:var(--muted);padding:6px 4px;transition:color .15s}
.footer-inner .links a:hover{color:var(--link)}

@media(max-width:640px){
  .nav-links{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;justify-content:flex-start;gap:1px;scrollbar-width:none}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{font-size:13px;padding:6px 8px;white-space:nowrap}
  .nav-inner{flex-wrap:nowrap}
  .brand-name{font-size:14px;white-space:nowrap}
  .welcome{padding:44px 0 28px}
  .post-item h2{font-size:19px}
  .post-item .post-excerpt{font-size:15px}
  .award-row{grid-template-columns:70px 1fr;gap:8px}
  .award-level{grid-column:2;font-size:10.5px}
  .post-body{font-size:15.5px}
  .post-body h2{font-size:21px}
}

/* ===== v2: media cards & story figure ===== */
.media-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:14px;}
@media(max-width:720px){.media-grid{grid-template-columns:1fr;}}
.media-card{
  display:flex;flex-direction:column;gap:8px;
  padding:20px 22px;border:1px solid var(--border);border-radius:14px;
  background:var(--card);text-decoration:none;color:inherit;
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.media-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px -14px rgba(0,0,0,.25);border-color:var(--accent);}
.media-tag{
  align-self:flex-start;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;background:var(--tag-bg);color:var(--accent);
}
.media-title{font-size:16px;font-weight:600;line-height:1.45;color:var(--text);}
.media-meta{font-size:12.5px;color:var(--muted);}
.media-card p{font-size:13.5px;line-height:1.65;color:var(--muted);margin:2px 0 6px;}
.media-link{font-size:13px;font-weight:500;color:var(--accent);margin-top:auto;}
.media-card:hover .media-link{text-decoration:underline;}
.story-figure{margin:18px 0 22px;}
.story-figure img{
  width:100%;border-radius:12px;border:1px solid var(--border);
  display:block;box-shadow:0 8px 24px -16px rgba(0,0,0,.3);
}
.story-figure figcaption{
  text-align:center;font-size:12.5px;color:var(--muted);margin-top:8px;
}

/* ===== new hero ===== */
.hero-new{padding:48px 0 24px;display:flex;flex-direction:column;gap:28px}
.hero-header{display:block}
.hero-body{display:grid;grid-template-columns:1.15fr 1fr;gap:36px;align-items:start}
@media(max-width:780px){.hero-body{grid-template-columns:1fr;gap:20px}}
.hero-portrait-row{display:flex;gap:24px;align-items:center;margin-bottom:20px}
.hero-portrait{width:120px;height:150px;object-fit:cover;border-radius:12px;border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.08)}
.hero-titles h1{font-size:28px;font-weight:700;margin:0 0 6px;letter-spacing:-.5px}
.hero-en{font-size:18px;font-weight:400;color:var(--muted);margin-left:8px}
.hero-role{margin:0 0 2px;font-size:14px;color:var(--fg)}
.hero-org{margin:0 0 10px;font-size:13px;color:var(--muted)}
.hero-logos{display:flex;gap:12px;align-items:center}
.school-logo{height:36px;width:auto;opacity:.85;transition:opacity .2s}
.school-logo:hover{opacity:1}
.hero-bio{font-size:15px;line-height:1.75;color:var(--fg);margin:0 0 16px}
.hero-figure{margin:0;text-align:center}
.hero-mol-img{width:100%;max-width:380px;border-radius:12px;border:1px solid var(--border);background:#fff;padding:12px}
.hero-figure figcaption{margin-top:10px;font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}
.brand-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;margin-right:8px;vertical-align:middle}
.brand-name{font-weight:600;font-size:15px}
/* photo gallery for CV/stories */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:18px 0}
.photo-grid img{width:100%;height:160px;object-fit:cover;border-radius:8px;border:1px solid var(--border);transition:transform .2s,box-shadow .2s;cursor:pointer}
.photo-grid img:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.photo-caption{font-size:12px;color:var(--muted);margin-top:-8px;margin-bottom:14px}
@media(max-width:780px){
  .hero-new{grid-template-columns:1fr;gap:24px}
  .hero-portrait-row{flex-direction:column;text-align:center}
  .hero-logos{justify-content:center}
}

.research-figure{margin:18px 0;text-align:center}
.research-figure img{max-width:100%;border-radius:10px;border:1px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.08)}
.research-figure figcaption{margin-top:8px;font-size:12px;color:var(--muted)}
.real-cover{padding:0;overflow:hidden}
.real-cover img{width:100%;height:100%;object-fit:cover}

/* ===== v7.4: water ambient + progress bar ===== */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.stars{position:absolute;inset:0;background-repeat:repeat}
.stars-1{
  background-image:
    radial-gradient(1px 1px at 20px 30px,rgba(100,140,200,.6),transparent),
    radial-gradient(1px 1px at 40px 70px,rgba(100,140,200,.6),transparent),
    radial-gradient(1.5px 1.5px at 90px 40px,rgba(80,120,190,.7),transparent),
    radial-gradient(1px 1px at 130px 80px,rgba(100,140,200,.6),transparent),
    radial-gradient(1px 1px at 160px 120px,rgba(80,120,190,.7),transparent),
    radial-gradient(1.5px 1.5px at 200px 50px,rgba(100,140,200,.6),transparent),
    radial-gradient(1px 1px at 240px 90px,rgba(80,120,190,.7),transparent),
    radial-gradient(1px 1px at 280px 30px,rgba(100,140,200,.6),transparent);
  background-size:300px 200px;opacity:.3;animation:twinkle 5s ease-in-out infinite;
}
.stars-2{
  background-image:
    radial-gradient(1px 1px at 50px 60px,rgba(150,170,200,.5),transparent),
    radial-gradient(1px 1px at 120px 20px,rgba(150,170,200,.5),transparent),
    radial-gradient(1.5px 1.5px at 180px 100px,rgba(120,140,180,.6),transparent),
    radial-gradient(1px 1px at 250px 40px,rgba(150,170,200,.5),transparent),
    radial-gradient(1px 1px at 30px 140px,rgba(120,140,180,.6),transparent);
  background-size:400px 300px;opacity:.22;animation:twinkle 7s ease-in-out infinite reverse;
}
.stars-3{
  background-image:
    radial-gradient(1px 1px at 80px 80px,rgba(200,210,225,.4),transparent),
    radial-gradient(1px 1px at 200px 150px,rgba(200,210,225,.4),transparent),
    radial-gradient(1px 1px at 320px 60px,rgba(200,210,225,.4),transparent);
  background-size:500px 400px;opacity:.18;animation:twinkle 9s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.5}}
/* soft water waves at bottom */
.water{
  position:absolute;bottom:-50px;left:-15%;width:130%;height:280px;
  background:linear-gradient(180deg,rgba(100,160,230,.28) 0%,rgba(80,140,210,.15) 50%,transparent 100%);
  border-radius:45%;
}
.water-1{animation:wave 7s ease-in-out infinite}
.water-2{bottom:-90px;animation:wave 10s ease-in-out infinite reverse;opacity:.9}
.water-3{
  bottom:-130px;left:-20%;width:140%;height:260px;
  background:linear-gradient(180deg,rgba(90,150,220,.2) 0%,rgba(70,120,200,.1) 50%,transparent 100%);
  animation:wave 13s ease-in-out infinite;opacity:.8;
}
/* soft top glow */
body::before{
  content:"";position:fixed;top:0;left:0;right:0;height:400px;
  background:radial-gradient(ellipse at 50% 0%,rgba(22,93,255,.09),transparent 65%);
  pointer-events:none;z-index:0;
}
@keyframes wave{
  0%,100%{transform:translateX(-5%) rotate(-3deg) scaleY(1)}
  25%{transform:translateX(2%) rotate(0deg) scaleY(1.08)}
  50%{transform:translateX(7%) rotate(3deg) scaleY(1.15)}
  75%{transform:translateX(3%) rotate(1.5deg) scaleY(1.08)}
}
/* top scroll progress bar */
.progress-bar{
  position:fixed;top:0;left:0;right:0;height:3px;z-index:200;
  background:rgba(22,93,255,.08);
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#165DFF,#4d7cff);
  transition:width .1s linear;
}
@media(prefers-reduced-motion:reduce){
  .stars-1,.stars-2,.stars-3,.water-1,.water-2,.water-3{animation:none}
}

      zh:`<p>2024 年 9 月，我开始了 Terrylene-O₂ 体系的半经验量子化学计算研究。作为项目队长，我需要从零搭建一条从构型生成、批量计算到数据分析的完整工作流。两年后回头看，这条管线最有价值的产出不是 179 个优化结构，而是一套<b>可复现、可审计、可扩展</b>的计算流程。</p>
<p>对于 C₃₀H₁₆-O₂ 这样的中大型体系，DFT 计算成本较高。PM7 半经验方法在保持合理精度的同时，将单个构型的优化时间压缩到分钟级，使得大规模筛选成为可能。但"算得快"只是起点——如何保证 179 个构型的质量、如何追踪每个结构的来源、如何在 5,554 个输出文件中快速定位问题，才是真正的挑战。</p>`,
      en:`<p>In September 2024, I started semi-empirical quantum chemistry calculations on the Terrylene-O₂ system. As team leader, I needed to build a complete workflow from configuration generation, batch computation, to data analysis from scratch. Two years later, the most valuable output of this pipeline is not the 179 optimized structures, but a <b>reproducible, auditable, and extensible</b> computational process.</p>
<p>For medium-large systems like C₃₀H₁₆-O₂, DFT is computationally expensive. PM7 semi-empirical method compresses single-configuration optimization to minutes while maintaining reasonable accuracy, enabling large-scale screening. But "fast computation" is only the starting point — ensuring quality across 179 configurations, tracing each structure's origin, and quickly locating issues among 5,554 output files are the real challenges.</p>`
    },
    toc:[
      {id:"why-pm7",zh:"为什么选择 PM7？",en:"Why PM7?"},
      {id:"config-design",zh:"179 个构型的系统设计",en:"Systematic Design of 179 Configurations"},

    body:{
      zh:`<h2 id="why-pm7">为什么选择 PM7？</h2>
<p>Terrylene（三萘嵌苯）是一种具有优异光电性质的多环芳烃分子，分子式 C₃₀H₁₆。我们研究的是 O₂ 分子在其骨架上的吸附与嵌入行为，目标是系统筛选所有可能的吸附位点并找到能量最低的结构盆地。</p>
<p>本科阶段没有集群可用，我唯一的计算节点就是自己的游戏本。用 DFT（B3LYP/6-31G* 级别）优化一个构型，在这台笔记本上大约要跑整整一天——风扇满转速、机身持续高温，期间基本干不了任何别的事。179 个构型就是 179 个整天，这对一个本科生来说完全不现实。PM7 半经验方法把单个构型压缩到 2-5 分钟，179 个构型的总计算量降到 10 小时以内——第一次让"系统筛选"真正成为可能。</p>
<blockquote><p>半经验方法不是"低配版 DFT"，而是一种不同的权衡：用参数化换取计算速度，在趋势预测和结构筛选层面完全够用，最终的关键结构再用 DFT 验证。</p></blockquote>
<h2 id="config-design">179 个构型的系统设计</h2>
<p>构型生成是整个研究中最容易被忽视、但最决定上限的环节。如果初始构型覆盖不全，后续再精密的计算也找不到真正的最小值。</p>
<p>我们的策略是：先对 Terrylene 骨架做对称性分析（D₂h 点群），识别出所有对称性不等价的吸附位点，然后为每个位点设计 O₂ 的多种取向（平行、垂直、倾斜）和键合模式（物理吸附、化学吸附、端基/侧基）。最终得到 <b>75 个吸附位点枚举 736 个对称轨道</b>，完成 179 个 PM7 优化构型。</p>
<p>每个构型记录包含：生成脚本版本、初始坐标来源、对称性标记、预期吸附类型。这一步的关键是<b>可追溯</b>——半年后回看任何一个结构，都能说清它是怎么来的。</p>
<h2 id="pipeline">批量计算管线</h2>
<p>批量计算的核心是一个 Python 驱动脚本，大致逻辑如下：</p>
<pre><code>def run_pipeline(configs, method="PM7"):
    for cfg in configs:
        # 1. 生成 MOPAC 输入文件
        inp = write_mop_input(cfg, method)
        # 2. 提交计算（本地或集群）
        out = run_mopac(inp)
        # 3. 解析输出：能量、几何、频率
        result = parse_mop_output(out)
        # 4. 质量检查
        if not passes_qc(result):
            retry_with_tighter_criteria(cfg)
        # 5. 记录到 manifest
        manifest.append(result)
    return manifest</code></pre>
<p>实际管线比这复杂得多——需要处理计算失败、结构异常收敛、对称性破缺等情况。但核心思想就是这五步：<b>生成 → 计算 → 解析 → 检查 → 记录</b>。</p>
<h2 id="qc">质量控制：不止于"算完了"</h2>
<p><span class="spicy-take">个人观点</span>计算化学中最常见的错误不是"算错了"，而是"算了但没检查"。一个收敛到错误极小值的结构，能量看起来合理，但物理上完全不对。</p>
<p>我们建立了三层审核机制：</p>
<ul>
<li><b>异常几何检查</b>：键长超出化学合理范围（如 C-C > 1.8 Å）、O-O 键长异常、分子平面严重扭曲</li>
<li><b>对称性重复检测</b>：优化后不同初始构型可能收敛到同一结构，用 Kabsch 算法做结构对齐 + RMSD 判定去重</li>
<li><b>命名-坐标一致性校验</b>：文件名中的位点标签必须与实际坐标中的吸附位置匹配</li>
</ul>
<p>所有产物附带版本化清单（manifest）和 SHA256 哈希。这意味着任何时候都能回答："这个结构是哪个版本的脚本生成的？输入坐标是什么？计算参数是什么？"</p>
<h2 id="lessons">踩坑与经验</h2>
<p>两年下来，最大的几个教训：</p>
<ol>
<li><b>不要手动管理文件名</b>。179 个构型靠人手命名一定会出错，用脚本生成结构化文件名（如 <code>T01_A_parallel_001.mop</code>）</li>
<li><b>振动频率计算不是可选的</b>。没有虚频检查，你永远不知道优化到的是极小值还是过渡态</li>
<li><b>保留中间文件</b>。最初为了省空间删了一些未收敛的输出，后来排查问题时追悔莫及</li>
<li><b>写文档的最佳时间是做的时候</b>，不是做完之后</li>
</ol>
<p>目前已完成 65 个结构盆地的分类、138 模振动频率计算和 20 个约束优化。下一步是 INDO/CIS12 UV-Vis 光谱计算，以及对关键结构做 DFT 验证。</p>`,
      en:`<h2 id="why-pm7">Why PM7?</h2>
<p>Terrylene is a polycyclic aromatic hydrocarbon with excellent optoelectronic properties, formula C₃₀H₁₆. We study the adsorption and intercalation of O₂ on its skeleton, aiming to systematically screen all possible adsorption sites and find the lowest-energy structural basins.</p>
<p>With no cluster access as an undergraduate, my only compute node was my own gaming laptop. A single DFT (B3LYP/6-31G*) geometry optimization on that machine took nearly a full day — fans at full speed, case running hot, and the laptop too busy for anything else. 179 configurations meant 179 full days: simply not feasible for an undergraduate. PM7 compressed each configuration to 2-5 minutes, bringing the total workload under 10 hours — the first time systematic screening became realistic.</p>
<blockquote><p>Semi-empirical methods are not "DFT lite" — they are a different tradeoff: parameterization for speed, perfectly adequate for trend prediction and structural screening, with key structures later validated by DFT.</p></blockquote>
<h2 id="config-design">Systematic Design of 179 Configurations</h2>
<p>Configuration generation is the most overlooked yet most decisive step. If initial configurations don't cover the full space, no amount of precise computation will find the true minimum.</p>
<p>Our strategy: first analyze Terrylene skeleton symmetry (D₂h point group), identify all symmetry-inequivalent adsorption sites, then design multiple O₂ orientations (parallel, perpendicular, tilted) and bonding modes (physisorption, chemisorption, terminal/side-on) for each site. This yields <b>75 adsorption sites spanning 736 symmetry orbits</b>, yielding 179 PM7-optimized structures.</p>
<p>Each record includes: generation script version, initial coordinate source, symmetry tag, and expected adsorption type. The key is <b>traceability</b> — six months later, for any structure, we can explain exactly how it was generated.</p>
<h2 id="pipeline">Batch Computation Pipeline</h2>
<p>The core of batch computation is a Python driver script:</p>
<pre><code>def run_pipeline(configs, method="PM7"):
    for cfg in configs:
        inp = write_mop_input(cfg, method)
        out = run_mopac(inp)
        result = parse_mop_output(out)
        if not passes_qc(result):
            retry_with_tighter_criteria(cfg)
        manifest.append(result)
    return manifest</code></pre>
<p>The real pipeline is far more complex — handling failures, anomalous convergence, symmetry breaking — but the core is these five steps: <b>generate → compute → parse → check → record</b>.</p>
<h2 id="qc">Quality Control: Beyond "It Computed"</h2>
<p><span class="spicy-take">Hot take</span>The most common error in computational chemistry is not "wrong calculation" but "calculated without checking." A structure converged to a wrong minimum can look energetically reasonable while being physically nonsensical.</p>
<p>We established a three-layer audit:</p>
<ul>
<li><b>Anomalous geometry check</b>: bond lengths outside chemically reasonable ranges (e.g., C-C > 1.8 Å), abnormal O-O bond lengths, severe molecular plane distortion</li>
<li><b>Symmetry duplicate detection</b>: different initial configs may converge to the same structure; use Kabsch alignment + RMSD for deduplication</li>
<li><b>Name-coordinate consistency</b>: the site label in the filename must match the actual adsorption position in coordinates</li>
</ul>
<p>All artifacts come with versioned manifests and SHA256 hashes. This means we can always answer: "Which script version generated this? What were the input coordinates? What were the calculation parameters?"</p>
<h2 id="lessons">Lessons Learned</h2>
<p>After two years, the biggest lessons:</p>
<ol>
<li><b>Never manage filenames manually</b>. 179 configs named by hand will contain errors. Use scripts for structured naming (e.g., <code>T01_A_parallel_001.mop</code>)</li>
<li><b>Vibrational frequency calculations are not optional</b>. Without imaginary frequency checks, you never know if you converged to a minimum or a transition state</li>
<li><b>Keep intermediate files</b>. I deleted some unconverged outputs to save space and deeply regretted it during debugging</li>
<li><b>The best time to write documentation is while doing it</b>, not after</li>
</ol>
<p>To date: 65 structural basins classified, 138-mode vibrational frequencies computed, 20 constrained optimizations done. Next steps: INDO/CIS12 UV-Vis spectroscopy and DFT validation of key structures.</p>`
    },

    title:{zh:"为什么我开始关注 AI 与材料的结合",en:"Why I Started Caring About AI + Materials"},
    excerpt:{
      zh:`<p>坦白说，大一大二的时候，我觉得 AI 跟材料专业没什么关系。那是计算机系的事，是程序员的事。这种心态在材料专业的学生里很常见——我们学的是晶体结构、相图、热力学，AI 听起来像是另一个世界的东西。</p>
<p>真正的转变发生在 Terrylene 项目中。当我们手里有 5,554 个输出文件、179 个优化结构的时候，传统的"一个个看"的方法彻底失效了。我开始写 Python 脚本批量解析输出、提取能量、做 Kabsch 结构对齐——这本质上就是在做<b>数据驱动的材料研究</b>。</p>`,
      en:`<p>Honestly, in my first two years, I thought AI had nothing to do with materials science. That was for CS students, for programmers. This mindset is common among materials undergrads — we study crystal structures, phase diagrams, thermodynamics, and AI sounds like something from another world.</p>
<p>The real shift happened in the Terrylene project. When we had 5,554 output files and 179 optimized structures, the traditional "look at them one by one" approach completely failed. I started writing Python scripts to batch-parse outputs, extract energies, and do Kabsch structural alignment — this is essentially <b>data-driven materials research</b>.</p>`
    },

    body:{
      zh:`<h2 id="turning">转折点：数据量上来了</h2>
<p>5,554 个文件是什么概念？如果每个文件花 2 分钟人工检查，需要 185 小时——超过一个月的全职工作。这还只是检查，不包括分析。</p>
<p>我写的第一个批量解析脚本只有 30 行 Python，但它把 185 小时的工作压缩到了 30 秒。那一刻我真切地感受到：<b>当数据量超过人工处理能力的阈值时，方法就必须改变</b>。</p>
<p>后来我又做了结构分类（基于能量和几何特征的聚类）、振动模式的自动化分析、UV-Vis 光谱的批量绘制。这些工作没有用到任何"高级 AI"——没有神经网络，没有机器学习——但它们是数据驱动的，是 AI for Science 的基础形态。</p>
<h2 id="amplify">AI 不是替代，是放大</h2>
<p><span class="spicy-take">个人观点</span>很多人对 AI for Science 的理解停留在"用 AI 替代科学家"，这是错的。AI for Science 的真正价值是<b>把科学家从重复性劳动中解放出来</b>，让我们能处理以前不可能处理的数据规模。</p>
<p>具体到计算材料：</p>
<ul>
<li><b>机器学习势（ML potentials）</b>：用 DFT 数据训练神经网络势函数，达到接近 DFT 的精度但速度快几个数量级。这使得纳秒级、百万原子级的模拟成为可能</li>
<li><b>材料信息学</b>：从已有材料数据库中挖掘结构-性质关系，预测新材料。这不是"猜"，而是基于统计学习的外推</li>
<li><b>自动化筛选</b>：像我们做的 Terrylene 筛选，本质上就是自动化高通量计算的雏形</li>
</ul>
<p>这些工具不会替代化学家的化学直觉——它们让化学直觉能在更大的空间里发挥作用。</p>
<h2 id="now">现在的我</h2>
<p>AI 已经成为我科研中不可或缺的一部分。从数据处理管线到结构分类，从文献阅读到代码辅助，它渗透在工作的每个环节。</p>
<p>我也在系统学习机器学习基础——不是为了转码，而是为了能真正理解 AI for Science 的方法论，能批判性地评估一篇用了 ML 的材料论文，能在自己的研究中选择合适的工具而不是盲目跟风。</p>
<blockquote><p>不是我选择了 AI，是数据量把我推到了 AI 面前。</p></blockquote>`,
      en:`<h2 id="turning">The Turning Point: Data Scale</h2>
<p>What does 5,554 files mean? If each takes 2 minutes to inspect manually, that's 185 hours — over a month of full-time work. And that's just inspection, not analysis.</p>
<p>My first batch parsing script was 30 lines of Python, but it compressed 185 hours into 30 seconds. In that moment I truly felt: <b>when data volume crosses the threshold of human processing capacity, the method must change</b>.</p>
<p>Later I did structure classification (clustering based on energy and geometric features), automated vibrational mode analysis, and batch UV-Vis spectrum plotting. None of this used "advanced AI" — no neural networks, no machine learning — but it was data-driven, the foundational form of AI for Science.</p>
<h2 id="amplify">AI Doesn't Replace, It Amplifies</h2>
<p><span class="spicy-take">Hot take</span>Many people understand AI for Science as "using AI to replace scientists." That's wrong. The real value is <b>freeing scientists from repetitive labor</b>, enabling us to handle data scales previously impossible.</p>
<p>In computational materials specifically:</p>
<ul>
<li><b>ML potentials</b>: Train neural network potentials on DFT data, achieving near-DFT accuracy at orders-of-magnitude faster speed. Enables nanosecond, million-atom simulations</li>
<li><b>Materials informatics</b>: Mine structure-property relationships from existing databases, predict new materials. Not "guessing" but statistically-grounded extrapolation</li>
<li><b>Automated screening</b>: Our Terrylene screening is essentially a prototype of automated high-throughput computation</li>
</ul>
<p>These tools don't replace chemical intuition — they let chemical intuition operate in a much larger space.</p>
<h2 id="now">Where I Am Now</h2>
<p>AI has become indispensable in my research. From data pipelines to structure classification, from literature reading to coding assistance, it permeates every step.</p>
<p>I'm also systematically learning ML fundamentals — not to switch to CS, but to truly understand the methodology of AI for Science, to critically evaluate a materials paper that uses ML, and to choose appropriate tools in my own research rather than blindly following trends.</p>
<blockquote><p>I didn't choose AI — the data scale pushed me toward it.</p></blockquote>`
    },

      zh:`<p>2026 年 8 月，我进入新加坡国立大学重庆研究院（NUSRI-CQ），开始 3+1+1 项目的大四学年。这是我第一次在全英文、研究导向的环境中系统学习，冲击比预想的大。</p>
<p>第一感受是课程强度。全英文授课、大量阅读材料、课堂讨论与项目并行。与东北大学的节奏相比，这里更强调<b>自主学习与批判性思考</b>，而不是被动接收。教授不会把知识喂到你嘴里——他会告诉你该读什么，然后在课堂上检验你是否真的理解了。</p>`,
      en:`<p>In August 2026, I joined NUS Research Institute in Chongqing (NUSRI-CQ) for my senior year in the 3+1+1 program. This was my first time studying systematically in an English-medium, research-oriented environment, and the impact was bigger than expected.</p>
<p>The first impression was intensity. English-medium instruction, extensive reading materials, classroom discussions and projects running in parallel. Compared to the pace at Northeastern University, this place emphasizes <b>self-directed learning and critical thinking</b> over passive reception. Professors don't feed you knowledge — they tell you what to read, then test whether you actually understood it in class.</p>`

    body:{
      zh:`<h2 id="intensity">课程强度：远超预期</h2>
<p>NUSRI 的课程不是"听课+考试"模式，而是"阅读+讨论+项目"模式。每门课每周的阅读量可能是 2-3 篇论文或章节，课堂上教授会随机点名提问，要求你用自己的话解释核心概念。</p>
<p>这对英语非母语的学生来说是双重挑战：既要理解专业内容，又要用英语表达。最初的两周我经常在课后花 2-3 倍时间复习课堂内容。</p>
<p>但这种模式的好处也很明显：<b>你不是在"学知识"，而是在"练能力"</b>。一个月后，我发现自己读英文论文的速度明显快了，课堂上也能更自如地提问和讨论。</p>
<h2 id="research">研究导向的训练</h2>
<p>NUSRI 的培养方案明显偏向研究训练。课程项目往往与真实科研问题挂钩，鼓励我们从文献中找问题、用计算工具解决问题。</p>
<p>比如有一门课的项目是复现一篇近期论文的计算结果。这不是照着做一遍——教授要求我们找出原文方法的局限性，并提出改进方案。这种训练方式与我之前做 Terrylene 项目的经验形成了很好的呼应：<b>科研不是执行，是质疑和改进</b>。</p>
<h2 id="adapt">适应与成长</h2>
<p>最初的不适应是真实的——语言、节奏、思维方式都需要调整。但一个月下来，我开始享受这种高强度的学习状态。</p>
<p>它迫使我更高效地管理时间，更精准地提取信息，更勇敢地表达不懂的东西。在国内的课堂上，"不懂装懂"是常态；在这里，教授会明确告诉你："如果有 30% 的内容没听懂，那是正常的，课后问。"</p>
<blockquote><p>高强度不是目的，是手段——它逼你跳出舒适区，用更快的速度成长。</p></blockquote>`,
      en:`<h2 id="intensity">Course Intensity: Beyond Expectations</h2>

    body:{
      zh:`<figure class="story-figure">
        <img src="assets/hs-math-awards.jpg" alt="高中数学竞赛与东南地区数学奥林匹克证书（2022）" loading="lazy">

<p>我是江西吉安永丰人，农村出身。小考全县第一、中考全校第一，听起来像标准学霸剧本，但这篇文章想讲的是<b>方法，而不是结果</b>——因为真正把我从"会考试"带到"会做研究"的，是一套我从高中就开始打磨、现在还在用的复盘方法。</p>
<h2>高中：在信息差里自己造工具</h2>
<p>进了省重点火箭班，我才第一次意识到什么叫地域差和信息差：说话带口音、竞赛基础为零、身边是天天玩却考得比我好的天赋型同学。前两年跟着竞赛走，寒暑假几乎不回家；竞赛放榜那次，我才知道自己的名字不在省一名单里。那种挫败感把我推到了一模不到 500 分的低谷。</p>
<p>真正改变我的不是励志故事，而是一张纸。我开始用一张<b>"时间复盘纸"</b>：每半小时记一次自己在做什么、状态如何、有没有被打断；晚上把这一天的时间轴摊开，对比哪个时段效率最高、哪个任务被高频拖延。八个月，16 本学科笔记、两本厚厚的反思本，每天光时间记录就占满一整页。</p>
<blockquote><p>"八个月从一模 490 到上岸 985"写在简历上只是一行字，背后是 240 天每天一张的时间轴。</p></blockquote>
<h2>四条我至今在用的方法</h2>
<ul>
<li><b>高频记录</b>：不低于每半小时一次，写在时间轴上，而不是脑子里——大脑擅长做事，不擅长记账。</li>
<li><b>AB 复盘</b>：同一类任务在不同时段、不同环境下的效果拉出来对比，用数据找最优方案，而不是靠感觉。</li>
<li><b>十分钟闭环</b>：把大任务切成"至少能在一个 10 分钟里完成一个闭环"的小块，闭环本身就是正反馈。</li>
<li><b>早起两小时</b>：在别人起床之前先干成一件最难的事，整天的状态就被锚定了。</li>
</ul>
<h2>把方法论搬到科研上</h2>
<p>进了东北大学，这套方法没有丢，只是换了对象。做 Terrylene-O₂ 项目时，我面对的是 75 个吸附位点、5,554 个 MOPAC 输出文件、179 个优化结构。如果靠"一个个打开看"，两个学期也看不完。</p>
<p>我把高中那套"记录—对比—找规律"原样搬过来：用 Python 批量解析输出、提取能量、做 Kabsch 结构对齐；用 SHA256 给每个文件打版本指纹，任何一步改动都能追溯到谁、什么时候、为什么——这本质上就是<b>科研版的时间复盘纸</b>。从半小时一次，变成一个构型一次。</p>
<h2>为什么这件事重要</h2>
<p>我越来越相信，科研和备考共享同一套底层能力：<b>把模糊的大问题拆成可执行的小闭环，用数据而不是情绪判断下一步，长期稳定地推进</b>。我的数学竞赛成绩从高中的 8 分走到大学的省一，不是因为突然变聪明了，是因为那套时间轴上的记录和复盘被重复了几千次。</p>
<p>如果说高中那张纸帮我考上了 985，那么现在，我希望它能帮我把一个本科生的计算项目，做到能真正拿得出手的工作。</p>
<blockquote><p>人生是一场漫长的自证预言——你愿意为什么样的系统付出时间，你就会成为什么样的人。</p></blockquote>`,
      en:`<figure class="story-figure">
        <img src="assets/hs-math-awards.jpg" alt="High-school math olympiad certificates (2022)" loading="lazy">
        <figcaption>High-school math competition and East China Mathematical Olympiad certificates (Summer 2022, Jiangxi)</figcaption>
      </figure>
<p>I grew up in a rural village in Yongfeng, Ji'an, Jiangxi. Top of the county in primary-school graduation, top of the school in the high-school entrance exam — on paper a straight-A track. But what I actually want to write about is <b>method, not results</b>, because the thing that moved me from "good at exams" to "capable of doing research" is a review system I've been polishing since high school.</p>
<h2>High School: Building My Own Tools Against an Information Gap</h2>
<p>Entering the city's top honors class, I first felt what regional and informational gaps actually look like: accented Mandarin, zero olympiad background, peers who scored higher while playing games. I followed the olympiad track for two years, spending almost every winter and summer on campus; when the results came out, I learned my name wasn't on the provincial first-prize list. That frustration dropped me to under 500 in the first mock exam.</p>
<p>What changed me wasn't motivation — it was a piece of paper. I started keeping a <b>"time-review sheet"</b>: every half hour, logging what I was doing, my state, interruptions. At night I'd lay the day's timeline flat and compare which slots were most productive, which tasks were chronically delayed. Eight months, 16 subject notebooks, two thick reflection journals — just the time log filled an entire page each day.</p>
<blockquote><p>"From 490 in the first mock to a 985 in eight months" is one line on a CV. Behind it are 240 days of timelines.</p></blockquote>
<h2>Four Methods I Still Use</h2>
<ul>
<li><b>High-frequency logging</b>: at least every 30 minutes, on a timeline — the brain is good at working, bad at bookkeeping.</li>
<li><b>A/B review</b>: compare the same task across slots and contexts; find the optimal setup by data, not feeling.</li>
<li><b>Ten-minute closed loops</b>: slice big tasks so that a single 10-minute block can complete one loop — the loop itself is the reward.</li>
<li><b>Two hours before everyone wakes</b>: finish the hardest task before others get up; that anchors the whole day.</li>
</ul>
<h2>Porting the Method to Research</h2>
<p>At Northeastern University, the method stayed — only the target changed. In the Terrylene-O₂ project I faced 75 adsorption sites, 5,554 MOPAC output files, 179 optimized structures. Opening them one by one would have eaten two semesters.</p>
<p>I reused the same "log — compare — find the rule" loop: Python scripts to batch-parse outputs and extract energies, Kabsch alignment, SHA256 versioning so every change is traceable to who/when/why. It's literally a <b>research-grade time-review sheet</b>, scaled from 30-minute ticks to one tick per configuration.</p>
<h2>Why This Matters</h2>
<p>I increasingly believe that research and exam prep share the same underlying loop: <b>decompose a fuzzy big problem into small executable closed loops, let data (not mood) decide the next step, and stay steady over the long run</b>. My math contest score went from 8 in high school to provincial first prize in college not because I suddenly got smarter, but because the logging and reviewing on that timeline were repeated thousands of times.</p>
<p>If that paper got me into a 985, I now want the same discipline to carry my undergraduate computational work into something genuinely worth showing.</p>
<blockquote><p>Life is a long self-fulfilling prophecy — you become the system you are willing to spend time on.</p></blockquote>`

    body:{
      zh:`<p>我很少说自己"努力"，因为我觉得努力这个词太模糊了。我更关心的是：<b>同样一天 24 小时，怎么把它花出最高的回报</b>。这是我高中竞赛失利后开始琢磨的问题，也是我做科研、做分享、做所有事情时的一套底层逻辑。</p>
<h2>取舍：把所有水活动的时间，全部用来整大事</h2>
<p>大二那年我给自己立了一条规矩：<b>水活动一律不参加，时间全部投给真正重要的事</b>。别人在凑素拓、刷存在感的时候，我在备赛、写项目、读文献。这不是苦行，而是一种主动的节流——我发现自己最稀缺的资源不是能力，而是<b>精力</b>。精力是有限的，把它分给十件小事，十件都做不好；把它压给一件大事，那一件能做出结果。</p>
<h2>把"努力"翻译成系统</h2>
<p>我不太相信意志力，我相信系统。高中的时候我靠一张时间复盘纸把每天切成半小时的格子；后来我研究精力管理，把一天按精力值划分时段，最难的事放在精力峰值，琐事塞进低谷期，晚上保证闭环式休息。慢慢地我摸到一套适合自己的"低能耗高回报"模式：<b>少切换、少内耗、一次只推一件事</b>，用复盘代替自我感动。</p>
<p>这套逻辑用在了 Terrylene 项目上：与其在 5,554 个输出文件里手工翻找，不如先花一周写好解析管线，之后每一秒都是高回报的。看起来"慢"，其实是把力气用在了杠杆点上。</p>
<h2>分享不是付出，是另一种学习</h2>
<p>我组织过读书打卡群，定下的规则很简单：坚持最重要，攀比是一切不幸福的来源。回到家乡高中做分享，我也不讲鸡汤，只讲"怎么用方法而不是蛮力"。因为每次准备分享，其实都是把自己做过的事重新系统化一遍——<b>分享者才是最大的受益者</b>。</p>
<blockquote><p>我擅长准备，不擅长临场发挥——所以我永远提前准备，把偶然变成必然。</p></blockquote>`,
      en:`<p>I rarely call myself "hardworking," because the word is too vague. What I actually care about is: <b>given the same 24 hours, how do I get the highest return</b>? This is a question I started wrestling with after losing in high-school math olympiad, and it has become the underlying logic behind everything I do — research, sharing, and daily life.</p>
<h2>Trade-offs: Cut the Noise, Invest in What Matters</h2>
<p>In my sophomore year I set a rule: <b>skip the filler activities, put all my time into the things that actually count</b>. While others collected activity points, I was preparing for competitions, writing project docs, and reading papers. This isn't asceticism — it's deliberate throttling. I realized my scarcest resource isn't ability, it's <b>energy</b>. Energy is finite: spread across ten small things, none of them get done well; concentrated on one big thing, that one delivers.</p>
<h2>Translating "Effort" into Systems</h2>
<p>I don't trust willpower; I trust systems. In high school I used a time-review sheet to split each day into half-hour cells. Later I studied energy management — dividing the day by energy level, putting the hardest task at peak hours, pushing chores into low-energy slots, and closing each night with proper rest. Slowly I found a "low-energy, high-return" mode that works for me: <b>fewer switches, less internal friction, one thing at a time</b>, and review instead of self-congratulation.</p>
<p>I applied the same logic to the Terrylene project: instead of manually searching through 5,554 output files, I spent the first week writing a parsing pipeline — after that, every second was high-return. It looks "slow," but it's putting effort at the leverage point.</p>
<h2>Sharing Isn't Giving Away — It's Another Way to Learn</h2>
<p>I organized a reading check-in group with one simple rule: persistence matters most, and comparison is the source of all unhappiness. When I return to my hometown high school to share, I don't talk inspiration — I talk about using method instead of brute force. Because every time I prepare a talk, I end up re-systematizing what I've done. <b>The sharer benefits the most.</b></p>
<blockquote><p>I'm good at preparation, not at winging it — so I always prepare early and turn chance into certainty.</p></blockquote>`

    body:{
      zh:`<p>2024 年暑期，我作为东北大学"理论之光·国情社情调研团"成员，和团队一起深入四川大凉山，走访越西县南箐镇与昭觉县则普乡，调研生态文明建设与乡村振兴。大凉山很大，大到两座相邻的乡镇，处境可以完全不同。</p>
<h2>两种乡村：南箐镇的“双轮驱动”与则普乡的“缺地缺路”</h2>
<p>南箐镇地势相对平坦，又正好在通往西昌的交通要道上，当地把农业和旅游业做成“双轮驱动”，生态保护与经济发展形成了看得见的双赢。而几十公里外的则普乡，偏远、交通不便、缺少平地，农业基础设施薄弱，农产品卖不出去是村民最发愁的事。</p>
<p>和乡书记座谈时，团队围绕“怎么提升农产品市场竞争力”聊了很久。我们提出，可以用短视频等新媒体手段宣传当地农产品——用数字化工具拓宽销售渠道。那一刻我意识到：<b>数据和方法的价值，从来不只属于实验室</b>。</p>
<h2>穿上民族服装，走进村寨</h2>
<p>我们在谷克德草原留影，身着彝族传统服饰走在林间，走访当地居民、考察乡村建设。这些画面比任何教科书都更直接地告诉我：乡村振兴不是一句口号，而是一个个具体的人、具体的难处、具体的可能性。</p>
<figure class="story-figure"><img src="assets/liangshan-group.jpg" alt="东北大学赴四川大凉山社会实践团合影" loading="lazy" style="object-fit:cover;object-position:50% 58%;max-height:480px;width:100%"><figcaption>东北大学赴四川大凉山社会实践团（2024 年暑期）</figcaption></figure>
<figure class="story-figure"><img src="assets/liangshan-5.jpg" alt="走访大凉山村寨" loading="lazy"><figcaption>身着当地民族服饰走访村寨</figcaption></figure>
<p>我自己就是从县城走出来的学生。在永丰，我靠一套方法考上 985；在凉山，我看到了另一种“方法稀缺”——不是没有资源，而是缺少把资源变成出路的信息与工具。这让我更坚定地想做好一件事：<b>无论以后做什么研究，都希望它最终能落到真实的人和真实的问题上</b>。</p>
<blockquote><p>数据思维不只在实验室里值钱——它应该被带进大山，带到每一个需要它的地方。</p></blockquote>`,
      en:`<p>In the summer of 2024, as a member of Northeastern University's "Theory & Light: National Conditions Survey" team, I traveled deep into the Liangshan Mountains of Sichuan with the group, visiting Nanjian Town (Yuexi County) and Zepu Township (Zhaojue County) to study ecological civilization and rural revitalization. Liangshan is vast — vast enough that two neighboring townships can face completely different realities.</p>
<h2>Two Kinds of Villages: Nanjian's "Two Engines" and Zepu's "No Land, No Road"</h2>
<p>Nanjian is relatively flat and sits on the main road to Xichang, so it runs agriculture and tourism as "two engines" — ecological protection and economic development in visible synergy. Dozens of kilometers away, Zepu is remote, short on flat land, weak in agricultural infrastructure. Getting local produce to market is the villagers' biggest headache.</p>
<p>In a discussion with the township party secretary, we focused on how to make local products more competitive. Our suggestion: use short-video platforms and other digital channels to promote them — using digital tools to widen the sales channels. At that moment I realized: <b>the value of data and method was never confined to the laboratory</b>.</p>
<h2>Wearing Yi Garb, Walking Into Villages</h2>
<p>We posed for photos on Gukede grassland, walked through forests in traditional Yi clothing, visited residents, and inspected village construction. More than any textbook, these scenes told me that rural revitalization is not a slogan — it is specific people, specific difficulties, and specific possibilities.</p>
<figure class="story-figure"><img src="assets/liangshan-group.jpg" alt="Field research team photo in Liangshan, Sichuan" loading="lazy"><figcaption>NEU field research team in Liangshan, Sichuan (Summer 2024)</figcaption></figure>
<figure class="story-figure"><img src="assets/liangshan-5.jpg" alt="Visiting a Liangshan village" loading="lazy"><figcaption>Walking through villages in local Yi clothing</figcaption></figure>
<p>I myself am a student from a county town. In Yongfeng, a system of methods got me into a 985; in Liangshan, I saw another kind of "scarcity of method" — not a lack of resources, but a lack of information and tools to turn resources into opportunities. It strengthened my conviction: <b>whatever research I end up doing, I want it to land on real people and real problems</b>.</p>
<blockquote><p>Data thinking isn't only valuable in the lab — it should be carried into the mountains, to every place that needs it.</p></blockquote>`
